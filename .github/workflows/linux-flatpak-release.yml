name: Fuego Wallet Linux Flatpak Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this release (e.g. 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run — build but do not submit"
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: "3.44.4"
  FLATPAK_APP_ID: "com.fuego.fuego_wallet"

jobs:
  build-flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git cmake libboost-all-dev libjsoncpp-dev \
            libssl-dev libzmq3-dev clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            flatpak flatpak-builder

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - name: Build fuego_walletd from source
        run: |
          git clone -b HEAT https://github.com/usexfg/fuego-suite.git fuego-source
          cd fuego-source
          sed -i 's/#include <json\/json.h>/#include <jsoncpp\/json.h>/g' src/CryptoNoteCore/ProofStructures.h
          mkdir build && cd build
          cmake .. -DBUILD_TESTS=OFF -DCMAKE_CXX_FLAGS="-I /usr/include"
          make -j$(nproc) PaymentGateService
          mkdir -p ../../assets/bin
          find . -name "walletd" -type f -executable -exec cp {} ../../assets/bin/fuego-walletd \;
          chmod +x ../../assets/bin/fuego-walletd

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Linux desktop app
        run: flutter build linux --release

      - name: Build Flatpak
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --repo=repo --force-clean build-dir flatpak/${{ env.FLATPAK_APP_ID }}.yml

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle repo xfg-wallet.flatpak ${{ env.FLATPAK_APP_ID }}

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: xfg-wallet.flatpak
          retention-days: 30

      - name: Summary
        run: |
          echo "## Linux Flatpak Release" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Flatpak bundle built: \`xfg-wallet.flatpak\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "- Dry run — no submission" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Artifact uploaded to release" >> $GITHUB_STEP_SUMMARY
          fi
