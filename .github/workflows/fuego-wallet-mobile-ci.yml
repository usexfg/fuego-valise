name: Fuego Wallet Mobile CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: fuego-wallet-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fuego-ffi compiles CryptoNight straight from fuego-suite/src/crypto
          submodules: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Enable Android
        run: flutter config --enable-android

      - name: Build Android natives (fuego-ffi, fuego_walletd)
        uses: ./.github/actions/build-android-natives

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 35
    needs: analyze
    continue-on-error: true

    steps:
      - name: Select Xcode
        run: |
          ls /Applications/Xcode*.app 2>/dev/null || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fuego-ffi compiles CryptoNight straight from fuego-suite/src/crypto
          submodules: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Enable iOS
        run: flutter config --enable-ios

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Build fuego-ffi for iOS
        run: |
          cd rust-fuego-wallet/fuego-sdk/fuego-ffi
          cargo build --release --target aarch64-apple-ios
          cd ../../../

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      # libfuego_ffi.a is force-loaded into Runner; Dart resolves these via DynamicLibrary.process().
      - name: Verify FFI symbols are linked into Runner
        run: |
          ./scripts/check-ios-ffi-symbols.sh build/ios/iphoneos/Runner.app/Runner

      - name: Package iOS App (.ipa)
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r Fuego-Wallet-iOS.ipa Payload

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-ios
          path: build/ios/iphoneos/Fuego-Wallet-iOS.ipa
          retention-days: 30
