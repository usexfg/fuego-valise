name: Fuego Wallet Mobile CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: fuego-wallet-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-cache-mobile-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-cache-mobile-

      - name: Install dependencies
        run: |
          for retry in 1 2 3; do
            if flutter pub get; then
              echo "✅ Flutter pub get successful on attempt $retry"
              break
            fi
            echo "❌ Flutter pub get failed on attempt $retry, retrying in 10 seconds..."
            sleep 10
          done

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-android:
    name: Build Android
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Enable Android
        run: flutter config --enable-android

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-cache-android-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-cache-android-

      - name: Install dependencies
        run: |
          for retry in 1 2 3; do
            if flutter pub get; then
              echo "✅ Flutter pub get successful on attempt $retry"
              break
            fi
            echo "❌ Flutter pub get failed on attempt $retry, retrying in 10 seconds..."
            sleep 10
          done

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 90
    needs: analyze

    steps:
      - name: Select Xcode
        run: |
          ls /Applications/Xcode*.app 2>/dev/null || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Enable iOS
        run: flutter config --enable-ios

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-cache-ios-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-cache-ios-

      - name: Install dependencies
        run: |
          for retry in 1 2 3; do
            if flutter pub get; then
              echo "✅ Flutter pub get successful on attempt $retry"
              break
            fi
            echo "❌ Flutter pub get failed on attempt $retry, retrying in 10 seconds..."
            sleep 10
          done

      - name: Build fuego-ffi staticlibs for iOS targets
        # Runner's "Build fuego-ffi" script phase normally builds these, but
        # `flutter build ios` migrates the Xcode project (SPM integration) and
        # CI runs showed the phase never executing on the runner, so the
        # force_load linker inputs (target/<triple>/release/libfuego_ffi.a)
        # are missing. Build them up-front here; cargo fast-paths when current.
        run: |
          set -euo pipefail
          manifest="rust-fuego-wallet/Cargo.toml"
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            echo "Building fuego-ffi for $target..."
            (env -u SDKROOT cargo build --release --manifest-path "$manifest" -p fuego-ffi --target "$target")
          done
          ls -lh rust-fuego-wallet/target/*/release/libfuego_ffi.a

      - name: Build for simulator
        run: flutter build ios --simulator --debug

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-ios-simulator
          path: build/ios/iphonesimulator/*.app
          retention-days: 30