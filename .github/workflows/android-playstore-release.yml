name: Fuego Wallet Android Play Store Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this release (e.g. 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run — build but do not submit"
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: "3.44.4"
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Enable Android support
        run: flutter config --enable-android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup Android keystore
        if: inputs.dry_run == false
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          cat > android/key.properties << EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build AAB (Release)
        run: flutter build appbundle --release

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  submit-to-play-store:
    name: Submit to Google Play Store
    needs: build-android
    runs-on: ubuntu-latest
    if: inputs.dry_run == false

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: play-store-aab
          path: ./artifacts

      - name: Upload to Google Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fuego.fuego_wallet
          releaseFiles: ./artifacts/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2

      - name: Summary
        run: |
          echo "## Android Play Store Release" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Uploaded AAB to Google Play **internal** track" >> $GITHUB_STEP_SUMMARY
