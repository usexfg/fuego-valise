name: Fuego Wallet - iOS App Store Build & Submission Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: false
      dry_run:
        description: "Dry run - build only, no upload"
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: "3.44.4"
  IOS_BUNDLE_ID: "com.fuego.fuego_wallet"
  IOS_SCHEME: "Runner"

jobs:
  ios-build:
    name: Build iOS App
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Enable iOS support
        run: flutter config --enable-ios

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-cache-ios-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-cache-ios-

      - name: Install dependencies
        run: |
          for retry in 1 2 3; do
            if flutter pub get; then
              echo "✅ Flutter pub get successful on attempt $retry"
              break
            fi
            echo "❌ Flutter pub get failed on attempt $retry, retrying in 10 seconds..."
            sleep 10
          done

      - name: Set up Rust for iOS
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Build fuego-ffi staticlibs for all iOS targets
        run: |
          manifest="rust-fuego-wallet/Cargo.toml"
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            echo "Building for $target..."
            cargo build --release --manifest-path "$manifest" -p fuego-ffi --target "$target"
          done
          ls -lh rust-fuego-wallet/target/*/release/libfuego_ffi.a

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build iOS app (Release)
        run: |
          echo "=== Building iOS app ==="
          flutter build ios --release --no-codesign
          echo "✅ iOS app built"

      - name: Verify iOS build
        run: |
          echo "=== Verifying iOS build ==="
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iOS app not found at $APP_PATH"
            exit 1
          fi
          echo "✅ Verification complete"

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-ios
          path: build/ios/iphoneos/Runner.app
          retention-days: 30