name: Fuego Wallet CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: fuego-wallet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 45
    needs: analyze

    steps:
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fuego-suite and its external/secp256k1 are needed to build fuegod
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable }

      - name: Build backends
        uses: ./.github/actions/build-desktop-backends

      - name: Build macOS app
        run: flutter build macos --release

      - name: Bundle backends into app
        uses: ./.github/actions/bundle-desktop-backends
        with:
          app: build/macos/Build/Products/Release/fuego_wallet.app

      - name: Re-sign
        run: ./scripts/sign-macos-app.sh build/macos/Build/Products/Release/fuego_wallet.app -

      - name: Package app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y Fuego-Wallet-macOS.zip "fuego_wallet.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-macos
          path: build/macos/Build/Products/Release/Fuego-Wallet-macOS.zip
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/Build/Products/Release/Fuego-Wallet-macOS.zip

  build-linux:
    name: Build Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fuego-suite and its external/secp256k1 are needed to build fuegod
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libstdc++-12-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable }

      - name: Build backends
        uses: ./.github/actions/build-desktop-backends

      - name: Build Linux app
        run: flutter build linux --release

      - name: Bundle backends into app
        uses: ./.github/actions/bundle-desktop-backends
        with:
          app: build/linux/x64/release/bundle

      - name: Add desktop entry and icon
        run: |
          cp linux/xfg-wallet.desktop build/linux/x64/release/bundle/ 2>/dev/null || true
          cp assets/logo/fuegologo.png build/linux/x64/release/bundle/fuego.png 2>/dev/null || true

      - name: Package app
        run: |
          cd build/linux/x64/release/bundle
          mkdir -p "$GITHUB_WORKSPACE/Fuego-Wallet"
          cp -r . "$GITHUB_WORKSPACE/Fuego-Wallet/"
          cd "$GITHUB_WORKSPACE"
          tar -czf Fuego-Wallet-Linux-x64.tar.gz Fuego-Wallet/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-linux-ubuntu
          path: Fuego-Wallet-Linux-x64.tar.gz
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Fuego-Wallet-Linux-x64.tar.gz

  # CryptoNight compiles a different implementation per target; Android uses the
  # portable / ARM-without-crypto paths. Each must reproduce mainnet PoW.
  ffi-cryptonight-paths:
    name: FFI / CryptoNight on portable, aarch64, armv7
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm -L /usr/arm-linux-gnueabihf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install cross compilers and qemu
        run: |
          sudo apt-get update || true
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross qemu-user

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf

      - name: Portable path (no AES-NI)
        env:
          CFLAGS: -DNO_AES
          CARGO_TARGET_DIR: target-noaes
        run: cargo test --manifest-path rust-fuego-wallet/Cargo.toml -p fuego-ffi

      # GCC's default aarch64 target has no crypto extension: the path Android arm64 compiles.
      - name: aarch64 without crypto extension (qemu)
        run: cargo test --manifest-path rust-fuego-wallet/Cargo.toml -p fuego-ffi --target aarch64-unknown-linux-gnu

      - name: armv7 (qemu)
        run: cargo test --manifest-path rust-fuego-wallet/Cargo.toml -p fuego-ffi --target armv7-unknown-linux-gnueabihf

  fuegod-wire-check:
    name: SDK / fuegod wire format
    # Toolchain matches where this was verified: Ubuntu 24.04, Boost 1.83.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install suite build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev

      - name: Resolve pinned fuego-suite commit
        id: suite
        run: echo "sha=$(git rev-parse HEAD:fuego-suite)" >> "$GITHUB_OUTPUT"

      # Keyed on the submodule pin: rebuilds only when Dependabot bumps it.
      - name: Cache fuegod build
        id: cache
        uses: actions/cache@v4
        with:
          path: fuego-suite/build
          key: fuegod-${{ runner.os }}-24.04-${{ steps.suite.outputs.sha }}

      - name: Build fuegod from the pinned submodule
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S fuego-suite -B fuego-suite/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build fuego-suite/build --target Daemon -j"$(nproc)"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable }

      - name: FFI CryptoNight vectors
        run: cargo test --manifest-path rust-fuego-wallet/Cargo.toml -p fuego-ffi

      # --testnet ungates RPC on an unsynced node; the nonexistent exclusive peer keeps it isolated.
      - name: Start fuegod (testnet, isolated)
        run: |
          mkdir -p "$RUNNER_TEMP/fuegod-data"
          nohup fuego-suite/build/src/fuegod --testnet --no-console \
            --data-dir "$RUNNER_TEMP/fuegod-data" \
            --rpc-bind-ip 127.0.0.1 --rpc-bind-port 28180 \
            --p2p-bind-ip 127.0.0.1 --p2p-bind-port 28080 \
            --add-exclusive-node 127.0.0.1:1 > "$RUNNER_TEMP/fuegod.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:28180/getinfo >/dev/null && exit 0
            sleep 1
          done
          echo "::error::fuegod RPC did not come up within 60s"
          cat "$RUNNER_TEMP/fuegod.log"
          exit 1

      - name: SDK wire-format round trips against fuegod
        env:
          FUEGOD_RPC_URL: http://127.0.0.1:28180
        run: cargo test --manifest-path rust-fuego-wallet/Cargo.toml -p fuego-sdk --test fuegod_wire -- --ignored

      - name: fuegod log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/fuegod.log" || true
