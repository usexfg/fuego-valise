name: Fuego Wallet CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: fuego-wallet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (warnings are errors; infos reported)
        run: |
          flutter analyze --fatal-warnings 2>&1 | tee analyze.log
          EXIT=${PIPESTATUS[0]}
          echo "## Analyzer summary" >> $GITHUB_STEP_SUMMARY
          grep -E "warning -|error -" analyze.log | wc -l | xargs echo "Warnings+Errors:" >> $GITHUB_STEP_SUMMARY || true
          grep -E "info -" analyze.log | wc -l | xargs echo "Infos:" >> $GITHUB_STEP_SUMMARY || true
          # Debt: strict-inference warnings exist (see PRODUCTION_AUDIT_REPORT.md). Gate currently on warnings only.
          # Roadmap: fix inference + cascade/const infos, then enable --fatal-infos.
          exit $EXIT

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Run tests (with coverage)
        run: |
          flutter test --coverage
          test -f coverage/lcov.info || (echo "coverage/lcov.info missing" && exit 1)

  rust-sdk:
    name: Rust SDK (tests + binding consistency)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable }

      - name: Test fuego-ffi (live Dart bridge crate)
        run: cargo test --manifest-path rust-fuego-wallet/fuego-sdk/fuego-ffi/Cargo.toml

      - name: Test native/crypto (mobile fuego_crypto crate)
        run: cargo test --manifest-path native/crypto/Cargo.toml

      - name: Binding consistency (every Dart FFI lookup must have a Rust export)
        run: |
          RUST=$(grep -oE 'fn (fuego|cn)_[a-z_]+' rust-fuego-wallet/fuego-sdk/fuego-ffi/src/lib.rs | sed 's/fn //;s/(//' | sort -u)
          DART=$(grep -oE "lookupFunction<[^,]+,[^>]+>\('[a-z_]+'" lib/ffi/fuego_native.dart | grep -oE "'[a-z_]+'" | tr -d "'" | sort -u)
          MISSING=$(comm -23 <(echo "$DART") <(echo "$RUST"))
          if [ -n "$MISSING" ]; then
            echo "::error::Dart FFI lookups with no matching Rust export in fuego-ffi:"
            echo "$MISSING"
            exit 1
          fi
          echo "All $(echo "$DART" | wc -l) Dart FFI lookups resolve to Rust exports."

      - name: Clippy (report-only)
        continue-on-error: true
        run: cargo clippy --manifest-path rust-fuego-wallet/fuego-sdk/fuego-ffi/Cargo.toml

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 45
    needs: analyze

    steps:
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable }

      - name: Build fuego_walletd (Rust — primary backend)
        run: |
          cargo build --release --manifest-path rust-fuego-wallet/core/Cargo.toml
          test -x rust-fuego-wallet/target/release/fuego_walletd
          # workspace may place binary under core/target or target/
          if [ ! -x rust-fuego-wallet/target/release/fuego_walletd ]; then
            mkdir -p rust-fuego-wallet/target/release
            cp rust-fuego-wallet/core/target/release/fuego_walletd \
              rust-fuego-wallet/target/release/fuego_walletd
          fi
          ls -la rust-fuego-wallet/target/release/fuego_walletd \
            rust-fuego-wallet/core/target/release/fuego_walletd 2>/dev/null || true

      - name: Build unified daemon (xfgo) — optional
        id: unified
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master --recurse-submodules --shallow-submodules \
            https://github.com/usexfg/fuego-suite.git xfgo-build
          cd xfgo-build
          brew install boost openssl icu4c jsoncpp cmake ninja || true
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=$(uname -m) \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          # PaymentGateService outputs as "unified". Daemon target produces
          # "fuegod" and MUST succeed — local mode depends on it.
          # (tests + incomplete swap chain clients break `cmake --build` all).
          echo "::group::Building fuegod (Daemon target)"
          cmake --build build --target Daemon -j$(sysctl -n hw.logicalcpu)
          echo "::endgroup::"
          FUEGOD="$(find build -name fuegod -type f | head -1)"
          if [ -z "$FUEGOD" ]; then
            echo "::error::Failed to build or find 'fuegod' binary from xfgo 'Daemon' target."
            exit 1
          fi
          cp "$FUEGOD" ../fuegod
          echo "Successfully built and copied fuegod."

          # `PaymentGateService` target (unified) is optional.
          echo "::group::Building unified (PaymentGateService target)"
          cmake --build build --target PaymentGateService -j$(sysctl -n hw.logicalcpu) || echo "Unified daemon build failed, continuing..."
          echo "::endgroup::"
          UNIFIED="$(find build -name unified -type f | head -1)"
          if [ -n "$UNIFIED" ]; then
            cp "$UNIFIED" ../unified
            echo "Successfully built and copied unified."
          fi

          # `SwapDaemon` target outputs "xfg-swapd" — cross-chain atomic
          # swaps (Dart Cross-Chain tab connects to its JSON-RPC on 18902).
          echo "::group::Building xfg-swapd (SwapDaemon target)"
          cmake --build build --target SwapDaemon -j$(sysctl -n hw.logicalcpu)
          echo "::endgroup::"
          SWAPD="$(find build -name xfg-swapd -type f | head -1)"
          if [ -z "$SWAPD" ]; then
            echo "::error::Failed to build or find 'xfg-swapd' binary from xfgo 'SwapDaemon' target."
            exit 1
          fi
          cp "$SWAPD" ../xfg-swapd
          echo "Successfully built and copied xfg-swapd."

          cd ..
          rm -rf xfgo-build
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Build macOS app
        run: flutter build macos --release

      - name: Bundle backends into app
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/fuego_wallet.app"
          BIN="$APP/Contents/MacOS"
          RESOURCES_BIN="$APP/Contents/Resources/bin"
          mkdir -p "$BIN" "$RESOURCES_BIN"

          # Primary: Rust wallet proxy
          WALLETD=""
          for c in \
            rust-fuego-wallet/target/release/fuego_walletd \
            rust-fuego-wallet/core/target/release/fuego_walletd
          do
            if [ -x "$c" ]; then WALLETD="$c"; break; fi
          done
          test -n "$WALLETD"
          cp "$WALLETD" "$BIN/fuego_walletd"
          cp "$WALLETD" "$RESOURCES_BIN/fuego_walletd"
          chmod +x "$BIN/fuego_walletd" "$RESOURCES_BIN/fuego_walletd"

          # fuegod is REQUIRED for local mode. The Rust backend refuses to
          # start embedded fuegod without it, so a bundle without fuegod is a
          # broken app — fail the build instead of shipping a degraded one.
          if [ -x ./fuegod ]; then
            cp ./fuegod "$BIN/fuegod"
            cp ./fuegod "$RESOURCES_BIN/fuegod"
            chmod +x "$BIN/fuegod" "$RESOURCES_BIN/fuegod"
          else
            echo "::error::fuegod missing — local mode would fail at runtime. Build the xfgo 'Daemon' target."
            exit 1
          fi

          # xfg-swapd REQUIRED — cross-chain atomic swaps depend on it.
          if [ -x ./xfg-swapd ]; then
            cp ./xfg-swapd "$BIN/xfg-swapd"
            cp ./xfg-swapd "$RESOURCES_BIN/xfg-swapd"
            chmod +x "$BIN/xfg-swapd" "$RESOURCES_BIN/xfg-swapd"
          else
            echo "::error::xfg-swapd missing — cross-chain swaps would fail at runtime. Build the xfgo 'SwapDaemon' target."
            exit 1
          fi

          if [ -x ./unified ]; then
            cp ./unified "$BIN/unified"
            cp ./unified "$RESOURCES_BIN/unified"
            chmod +x "$BIN/unified" "$RESOURCES_BIN/unified"
          fi

      - name: Bundle daemon dylibs into app
        run: ./scripts/bundle-macos-dylibs.sh "build/macos/Build/Products/Release/fuego_wallet.app"

      - name: Re-sign
        run: |
          APP="build/macos/Build/Products/Release/fuego_wallet.app"
          codesign --force --sign - "$APP/Contents/MacOS/fuego_walletd"
          codesign --force --sign - "$APP/Contents/MacOS/unified"
          codesign --force --sign - "$APP/Contents/MacOS/fuegod"
          codesign --force --sign - "$APP/Contents/MacOS/xfg-swapd"
          find "$APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 -type d -name "*.framework" -exec codesign --force --sign - {} \;
          find "$APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 -name "*.dylib" -exec codesign --force --sign - {} \;
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP" || { echo "::error::codesign verification failed"; exit 1; }

      - name: Package app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y Fuego-Wallet-macOS.zip "fuego_wallet.app"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-macos
          path: build/macos/Build/Products/Release/Fuego-Wallet-macOS.zip
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/Build/Products/Release/Fuego-Wallet-macOS.zip

  build-linux:
    name: Build Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libstdc++-12-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with: { toolchain: stable }

      - name: Build fuego_walletd (Rust — primary backend)
        run: |
          cargo build --release --manifest-path rust-fuego-wallet/core/Cargo.toml
          if [ ! -x rust-fuego-wallet/target/release/fuego_walletd ]; then
            mkdir -p rust-fuego-wallet/target/release
            cp rust-fuego-wallet/core/target/release/fuego_walletd \
              rust-fuego-wallet/target/release/fuego_walletd
          fi
          test -x rust-fuego-wallet/target/release/fuego_walletd || \
            test -x rust-fuego-wallet/core/target/release/fuego_walletd

      - name: Build unified daemon (xfgo) — optional
        id: unified
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master --recurse-submodules --shallow-submodules \
            https://github.com/usexfg/fuego-suite.git xfgo-build
          cd xfgo-build
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          # `Daemon` target (fuegod) is REQUIRED for local mode to work.
          echo "::group::Building fuegod (Daemon target)"
          cmake --build build --target Daemon -j"$(nproc)"
          echo "::endgroup::"
          FUEGOD="$(find build -name fuegod -type f | head -1)"
          if [ -z "$FUEGOD" ]; then
            echo "::error::Failed to build or find 'fuegod' binary from xfgo 'Daemon' target."
            exit 1
          fi
          cp "$FUEGOD" ../fuegod
          echo "Successfully built and copied fuegod."

          # `PaymentGateService` target (unified) is optional.
          echo "::group::Building unified (PaymentGateService target)"
          cmake --build build --target PaymentGateService -j"$(nproc)" || echo "Unified daemon build failed, continuing..."
          echo "::endgroup::"
          UNIFIED="$(find build -name unified -type f | head -1)"
          if [ -n "$UNIFIED" ]; then
            cp "$UNIFIED" ../unified
            echo "Successfully built and copied unified."
          fi

          # `SwapDaemon` target outputs "xfg-swapd" — cross-chain swaps.
          echo "::group::Building xfg-swapd (SwapDaemon target)"
          cmake --build build --target SwapDaemon -j"$(nproc)"
          echo "::endgroup::"
          SWAPD="$(find build -name xfg-swapd -type f | head -1)"
          if [ -z "$SWAPD" ]; then
            echo "::error::Failed to build or find 'xfg-swapd' binary from xfgo 'SwapDaemon' target."
            exit 1
          fi
          cp "$SWAPD" ../xfg-swapd
          echo "Successfully built and copied xfg-swapd."

          cd ..
          rm -rf xfgo-build
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Build Linux app
        run: flutter build linux --release

      - name: Bundle backends into app
        run: |
          set -euo pipefail
          BUNDLE="build/linux/x64/release/bundle"
          WALLETD=""
          for c in \
            rust-fuego-wallet/target/release/fuego_walletd \
            rust-fuego-wallet/core/target/release/fuego_walletd
          do
            if [ -x "$c" ]; then WALLETD="$c"; break; fi
          done
          test -n "$WALLETD"
          cp "$WALLETD" "$BUNDLE/fuego_walletd"
          chmod +x "$BUNDLE/fuego_walletd"
          if [ -x ./unified ]; then cp ./unified "$BUNDLE/" && chmod +x "$BUNDLE/unified"; fi
          # fuegod required — local mode depends on it. Fail rather than ship broken.
          if [ -x ./fuegod ]; then
            cp ./fuegod "$BUNDLE/" && chmod +x "$BUNDLE/fuegod"
          else
            echo "::error::fuegod missing — local mode would fail at runtime. Build the xfgo 'Daemon' target."
            exit 1
          fi
          # xfg-swapd required — cross-chain atomic swaps depend on it.
          if [ -x ./xfg-swapd ]; then
            cp ./xfg-swapd "$BUNDLE/" && chmod +x "$BUNDLE/xfg-swapd"
          else
            echo "::error::xfg-swapd missing — cross-chain swaps would fail at runtime. Build the xfgo 'SwapDaemon' target."
            exit 1
          fi
          cp linux/xfg-wallet.desktop "$BUNDLE/" 2>/dev/null || true
          cp assets/logo/fuegologo.png "$BUNDLE/fuego.png" 2>/dev/null || true

      - name: Package app
        run: |
          cd build/linux/x64/release/bundle
          mkdir -p "$GITHUB_WORKSPACE/Fuego-Wallet"
          cp -r . "$GITHUB_WORKSPACE/Fuego-Wallet/"
          cd "$GITHUB_WORKSPACE"
          tar -czf Fuego-Wallet-Linux-x64.tar.gz Fuego-Wallet/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuego-wallet-linux-ubuntu
          path: Fuego-Wallet-Linux-x64.tar.gz
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Fuego-Wallet-Linux-x64.tar.gz
