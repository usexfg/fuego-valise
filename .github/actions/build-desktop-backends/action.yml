name: Build desktop backends
description: >-
  Builds fuego_walletd + fuego-ffi (Rust) and fuegod, xfg-swapd, unifyd from
  the pinned fuego-suite submodule into ./backends. Needs a checkout with
  submodules: recursive and a Rust toolchain. Run before `flutter build`.

runs:
  using: composite
  steps:
    - name: Install suite build dependencies
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install boost openssl icu4c jsoncpp cmake ninja || true
        elif [ "$RUNNER_OS" = "Windows" ]; then
          # Windows deps come from the pwsh step below. The old
          # `choco install ninja boost-msvc-14.3` path here was a toolchain
          # mismatch: -G Ninja picks the MinGW gcc on PATH, which cannot link
          # MSVC-flavoured boost libs, and FindBoost then failed with
          # "Could NOT find Boost (missing: Boost_INCLUDE_DIR ...)".
          # We now mirror fuego-suite's own proven Windows recipe
          # (.github/workflows/check.yml build-windows): MSVC generator,
          # vcpkg for jsoncpp/openssl, and an evidence-driven Boost install
          # (see the pwsh step below: run 41135681226 proved the DIY 1.85
          # Inno install lands nowhere, while run 41022264264 proved the
          # chocolatey boost-msvc-14.3 package installs successfully).
          :
        else
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev
        fi

    - name: Install Windows Boost + OpenSSL + vcpkg deps
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # ---- Boost ----
        # Rationale: the official 1.85 binaries installer (suite's exact file)
        # exited without creating C:\boost\lib on this image (run 41135681226),
        # while `choco install boost-msvc-14.3` provably installed successfully
        # (run 41022264264: "boost-msvc-14.3 has been installed"). So install
        # the chocolatey package and DISCOVER the actual root instead of
        # assuming any destination. The Inno layout is <root>\include\boost-1_X\.
        if (Test-Path "C:\boost\lib") {
          $boost_root = "C:\boost"
        } else {
          choco install boost-msvc-14.3 -y --no-progress
          $boost_root = $null
          # 1) Inno Setup uninstall key InstallLocation (normal + WOW6432 hives).
          foreach ($hive in @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )) {
            $reg = Get-ItemProperty $hive -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "*boost*" -and $_.InstallLocation } |
              Select-Object -First 1
            if ($reg -and (Test-Path $reg.InstallLocation)) {
              $boost_root = $reg.InstallLocation.TrimEnd('\')
              break
            }
          }
          # 2) Known candidate dirs.
          if (-not $boost_root) {
            $cands = Get-ChildItem "C:\local","C:\Program Files","C:\" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "boost*" }
            if ($cands) { $boost_root = ($cands | Sort-Object Name -Descending | Select-Object -First 1).FullName }
          }
          # 3) Last resort: filesystem scan for the boost headers themselves.
          if (-not $boost_root) {
            $vh = Get-ChildItem "C:\local","C:\Program Files","C:\" -Recurse -Filter "version.hpp" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*boost*" -and ((Get-Content $_.FullName) -match '^#define BOOST_LIB_VERSION') } |
              Select-Object -First 1
            if ($vh) {
              # ...\include\boost-1_87\boost\version.hpp -> ...\include\boost-1_87
              $boost_root = Split-Path (Split-Path $vh.FullName -Parent) -Parent
            }
          }
          if (-not $boost_root) {
            Get-ChildItem "C:\" -Directory -ErrorAction SilentlyContinue | Select-Object Name | Out-String | Write-Host
            throw "boost-msvc-14.3 installed but no Boost root could be located"
          }
        }
        Write-Host "BOOST_ROOT=$boost_root"
        $boost_include = $null
        if (Test-Path "$boost_root\include") {
          $boost_include = (Get-ChildItem "$boost_root\include" -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "boost\version.hpp") } |
            Select-Object -First 1).FullName
        }
        if (-not $boost_include) {
          $vhAny = Get-ChildItem "$boost_root" -Recurse -Filter "version.hpp" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*boost*" } | Select-Object -First 1
          if ($vhAny) {
            # <boost-1_X>\boost\version.hpp -> <boost-1_X>  (parent of the boost dir)
            $boost_include = Split-Path $vhAny.Directory.FullName -Parent
          }
        }
        if (-not $boost_include) { throw "no boost headers found under $boost_root" }
        if (-not (Test-Path (Join-Path $boost_include "boost\version.hpp"))) { throw "boost_include=$boost_include does not contain boost\version.hpp" }
        Write-Host "BOOST_INCLUDE_DIR=$boost_include"
        $boost_lib = "$boost_root\lib"
        if (-not (Test-Path $boost_lib)) { throw "no lib dir under $boost_root" }
        $vcLibs = Get-ChildItem "$boost_lib" -Filter "*-vc143-mt*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $vcLibs) { Write-Host "WARNING: no vc143 .lib files found in $boost_lib"; Get-ChildItem $boost_lib | Select-Object -First 10 Name | Out-String | Write-Host }
        echo "BOOST_ROOT=$boost_root" >> $env:GITHUB_ENV
        echo "BOOST_INCLUDE_DIR=$boost_include" >> $env:GITHUB_ENV
        echo "BOOST_LIB_DIR=$boost_lib" >> $env:GITHUB_ENV
        # ---- OpenSSL: find a dev install on the image; fall back to choco ----
        # (same detection as suite check.yml so both repos stay in lockstep)
        $candidates = @(
          "C:\Program Files\OpenSSL-Win64",
          "C:\Program Files\OpenSSL",
          "C:\Program Files\FireDaemon OpenSSL 3"
        )
        $openssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
        if (-not $openssl) {
          $found = Get-ChildItem -Path "C:\Program Files" -Filter "ssl.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { $openssl = (Get-Item $found.FullName).Directory.Parent.Parent.FullName }
        }
        if (-not $openssl) {
          choco install openssl -y --no-progress
          $openssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $openssl) { throw "OpenSSL not found after choco install" }
        }
        echo "OPENSSL_ROOT_DIR=$openssl" >> $env:GITHUB_ENV
        # ---- jsoncpp (+ vcpkg openssl) exactly as suite check.yml does ----
        $vcpkgDir = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { throw "vcpkg not found on runner image" }
        & (Join-Path $vcpkgDir "vcpkg.exe") install --no-progress jsoncpp:x64-windows openssl:x64-windows

    - name: Build fuego_walletd and fuego-ffi
      shell: bash
      run: |
        set -euo pipefail
        cargo build --release --manifest-path rust-fuego-wallet/Cargo.toml \
          -p rust_fuego_wallet -p fuego-ffi
        mkdir -p backends
        if [ "$RUNNER_OS" = "Windows" ]; then
          cp rust-fuego-wallet/target/release/fuego_walletd.exe backends/ 2>/dev/null || cp rust-fuego-wallet/target/release/fuego_walletd backends/
          cp rust-fuego-wallet/target/release/fuego_ffi.dll backends/libfuego_ffi.dll 2>/dev/null || cp rust-fuego-wallet/target/release/libfuego_ffi.dll backends/ 2>/dev/null || true
        elif [ "$RUNNER_OS" = "macOS" ]; then
          cp rust-fuego-wallet/target/release/fuego_walletd backends/
          cp rust-fuego-wallet/target/release/libfuego_ffi.dylib backends/
          cp rust-fuego-wallet/target/release/libfuego_ffi.dylib macos/Runner/libfuego_ffi.dylib
        else
          cp rust-fuego-wallet/target/release/fuego_walletd backends/
          cp rust-fuego-wallet/target/release/libfuego_ffi.so backends/
        fi

    - name: Build fuegod, xfg-swapd, unifyd
      shell: bash
      run: |
        set -euo pipefail
        portable_cmake() { env -u CI -u GITHUB_ACTIONS -u GITHUB_REF -u GITHUB_RUN_ID cmake "$@"; }
        if [ "$RUNNER_OS" = "macOS" ]; then
          portable_cmake -S fuego-suite -B fuego-suite/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
        elif [ "$RUNNER_OS" = "Windows" ]; then
          # Suite's Windows CI (check.yml) builds with the MSVC generator and
          # explicit hint flags; the MinGW compiler on PATH cannot pair with
          # boost-msvc libs. Detect the installed VS year so this works on
          # windows-2022 (VS17/2022) and windows-2025 (VS18/2026) images.
          if [ -d "/c/Program Files/Microsoft Visual Studio/2025" ]; then
            vs_gen="Visual Studio 18 2026"
          else
            vs_gen="Visual Studio 17 2022"
          fi
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "::error::VCPKG_INSTALLATION_ROOT is not set on this runner"
            exit 1
          fi
          cmake_args=( -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
                       -DVCPKG_TARGET_TRIPLET=x64-windows )
          # These come from the pwsh install step's discovery (GITHUB_ENV).
          # Only C:\boost keeps a hardcoded fallback, and the *versioned*
          # include path is NEVER assumed: FindBoost resolves it from
          # BOOST_ROOT anyway, the reported include dir is just a fast path.
          if [ -n "${BOOST_ROOT:-}" ]; then
            cmake_args+=( -DBOOST_ROOT="$BOOST_ROOT" )
          elif [ -d "/c/boost" ]; then
            cmake_args+=( -DBOOST_ROOT="C:/boost" )
          fi
          if [ -n "${BOOST_INCLUDE_DIR:-}" ]; then
            cmake_args+=( -DBOOST_INCLUDEDIR="$BOOST_INCLUDE_DIR" )
          fi
          if [ -n "${BOOST_LIB_DIR:-}" ]; then
            cmake_args+=( -DBOOST_LIBRARYDIR="$BOOST_LIB_DIR" )
          fi
          if [ -n "${OPENSSL_ROOT_DIR:-}" ]; then
            cmake_args+=( -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" )
          fi
          portable_cmake -S fuego-suite -B fuego-suite/build -G "$vs_gen" -A x64 "${cmake_args[@]}"
        else
          portable_cmake -S fuego-suite -B fuego-suite/build -G Ninja -DCMAKE_BUILD_TYPE=Release
        fi
        if [ "$RUNNER_OS" = "Windows" ]; then
          # MSVC generator is multi-config: pick Release explicitly, and keep
          # msbuild parallel (without --parallel it runs projects serially).
          cmake --build fuego-suite/build --target Daemon SwapDaemon \
            --config Release --parallel "$NUMBER_OF_PROCESSORS"
        else
          cmake --build fuego-suite/build --target Daemon SwapDaemon
        fi
        # Windows MSVC builds emit <name>.exe into per-config directories.
        find_bin() { find fuego-suite/build/ \( -name "$1" -o -name "$1.exe" \) -type f | head -1; }
        FUEGOD="$(find_bin fuegod)"
        SWAPD="$(find_bin xfg-swapd)"
        if [ -z "$FUEGOD" ] || [ -z "$SWAPD" ]; then
          echo "::error::fuegod or xfg-swapd missing after build"
          exit 1
        fi
        cp "$FUEGOD" "$SWAPD" backends/
        if [ "$RUNNER_OS" = "Windows" ]; then
          cmake --build fuego-suite/build --target PaymentGateService \
            --config Release --parallel "$NUMBER_OF_PROCESSORS"
        else
          cmake --build fuego-suite/build --target PaymentGateService
        fi
        # The pinned suite (<=1.10.02 line) outputs the wallet-cli binary as
        # "unified"; newer suite renamed it "unifyd". Accept either name so the
        # bundle step can't silently skip the wallet backend.
        UNIFYD="$(find_bin unifyd)"
        if [ -z "$UNIFYD" ]; then
          UNIFYD="$(find_bin unified)"
        fi
        if [ -z "$UNIFYD" ]; then
          echo "::error::unifyd (or unified) missing after the PaymentGateService build"
          exit 1
        fi
        cp "$UNIFYD" backends/
        ls -la backends
