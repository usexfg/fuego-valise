name: Build desktop backends
description: >-
  Builds fuego_walletd + fuego-ffi (Rust) and fuegod, xfg-swapd, unified from
  the pinned fuego-suite submodule into ./backends. Needs a checkout with
  submodules: recursive and a Rust toolchain. Run before `flutter build`.

runs:
  using: composite
  steps:
    - name: Install suite build dependencies
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install boost openssl icu4c jsoncpp cmake ninja || true
        elif [ "$RUNNER_OS" = "Windows" ]; then
          :
        else
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libboost-all-dev libssl-dev libicu-dev libjsoncpp-dev
        fi

    - name: Install Windows Boost + OpenSSL + vcpkg deps
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install boost-msvc-14.3 -y --no-progress
        $boost_root = (Get-ChildItem "C:\local" -Directory -Filter "boost_*" | Sort-Object Name -Descending | Select-Object -First 1).FullName
        if (-not $boost_root) { throw "boost-msvc-14.3 left no C:\local\boost_* directory" }
        $version_header = Get-ChildItem $boost_root -Recurse -Filter "version.hpp" |
          Where-Object { $_.Directory.Name -eq "boost" } | Select-Object -First 1
        if (-not $version_header) { throw "no boost\version.hpp under $boost_root" }
        $boost_include = $version_header.Directory.Parent.FullName
        $vc_lib = Get-ChildItem $boost_root -Recurse -Filter "*vc143*.lib" | Select-Object -First 1
        if (-not $vc_lib) {
          Get-ChildItem $boost_root -Directory | Select-Object Name | Out-String | Write-Host
          throw "no vc143 boost libraries under $boost_root"
        }
        $boost_lib = $vc_lib.Directory.FullName
        Write-Host "BOOST_ROOT=$boost_root INCLUDE=$boost_include LIB=$boost_lib"
        echo "BOOST_ROOT=$boost_root" >> $env:GITHUB_ENV
        echo "BOOST_INCLUDE_DIR=$boost_include" >> $env:GITHUB_ENV
        echo "BOOST_LIB_DIR=$boost_lib" >> $env:GITHUB_ENV
        $candidates = @("C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL", "C:\Program Files\FireDaemon OpenSSL 3")
        $openssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
        if (-not $openssl) {
          choco install openssl -y --no-progress
          $openssl = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $openssl) { throw "OpenSSL not found after choco install" }
        }
        echo "OPENSSL_ROOT_DIR=$openssl" >> $env:GITHUB_ENV
        $vcpkgDir = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { throw "vcpkg not found on runner image" }
        & (Join-Path $vcpkgDir "vcpkg.exe") install --no-progress jsoncpp:x64-windows openssl:x64-windows

    - name: Build fuego_walletd and fuego-ffi
      shell: bash
      run: |
        set -euo pipefail
        cargo build --release --manifest-path rust-fuego-wallet/Cargo.toml \
          -p rust_fuego_wallet -p fuego-ffi
        mkdir -p backends
        if [ "$RUNNER_OS" = "Windows" ]; then
          cp rust-fuego-wallet/target/release/fuego_walletd.exe backends/
          cp rust-fuego-wallet/target/release/fuego_ffi.dll backends/libfuego_ffi.dll
          exit 0
        fi
        cp rust-fuego-wallet/target/release/fuego_walletd backends/
        if [ "$RUNNER_OS" = "macOS" ]; then
          cp rust-fuego-wallet/target/release/libfuego_ffi.dylib backends/
          # Xcode's "Bundle Framework" phase copies it into Contents/Frameworks.
          cp rust-fuego-wallet/target/release/libfuego_ffi.dylib macos/Runner/libfuego_ffi.dylib
        else
          cp rust-fuego-wallet/target/release/libfuego_ffi.so backends/
        fi

    - name: Build fuegod, xfg-swapd, unified
      shell: bash
      run: |
        set -euo pipefail
        # suite's CMake adds -march=native to Crypto when CI/GITHUB_* is set at configure
        # time; shipped daemons would then die with SIGILL on CPUs older than the runner.
        portable_cmake() { env -u CI -u GITHUB_ACTIONS -u GITHUB_REF -u GITHUB_RUN_ID cmake "$@"; }
        if [ "$RUNNER_OS" = "macOS" ]; then
          portable_cmake -S fuego-suite -B fuego-suite/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
        elif [ "$RUNNER_OS" = "Windows" ]; then
          if [ -d "/c/Program Files/Microsoft Visual Studio/2025" ]; then
            vs_generator="Visual Studio 18 2026"
          else
            vs_generator="Visual Studio 17 2022"
          fi
          portable_cmake -S fuego-suite -B fuego-suite/build -G "$vs_generator" -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DBOOST_ROOT="$BOOST_ROOT" -DBOOST_INCLUDEDIR="$BOOST_INCLUDE_DIR" \
            -DBOOST_LIBRARYDIR="$BOOST_LIB_DIR" -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"
        else
          portable_cmake -S fuego-suite -B fuego-suite/build -G Ninja -DCMAKE_BUILD_TYPE=Release
        fi
        build_config=()
        if [ "$RUNNER_OS" = "Windows" ]; then build_config=(--config Release --parallel "$NUMBER_OF_PROCESSORS"); fi
        # fuegod (local mode) and xfg-swapd (cross-chain swaps) are required.
        cmake --build fuego-suite/build --target Daemon SwapDaemon "${build_config[@]}"
        find_bin() { find fuego-suite/build/ \( -name "$1" -o -name "$1.exe" \) -type f | head -1; }
        FUEGOD="$(find_bin fuegod)"
        SWAPD="$(find_bin xfg-swapd)"
        if [ -z "$FUEGOD" ] || [ -z "$SWAPD" ]; then
          echo "::error::fuegod or xfg-swapd missing after build"
          exit 1
        fi
        cp "$FUEGOD" "$SWAPD" backends/
        # unified is part of the required desktop bundle (AGENTS.md); never ship without it.
        cmake --build fuego-suite/build --target PaymentGateService "${build_config[@]}"
        UNIFIED="$(find_bin unified)"
        if [ -z "$UNIFIED" ]; then
          echo "::error::unified missing after the PaymentGateService build"
          exit 1
        fi
        cp "$UNIFIED" backends/
        ls -la backends
