name: Bundle desktop backends
description: >-
  Copies ./backends (from build-desktop-backends) into a built app where
  DaemonManager and FuegoNative look for them. Run after `flutter build`.

inputs:
  app:
    description: macOS .app bundle path, or Linux bundle directory
    required: true

runs:
  using: composite
  steps:
    - name: Bundle backends
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: |
        set -euo pipefail
        test -d "$APP"
        if [ "$RUNNER_OS" = "macOS" ]; then
          for b in fuego_walletd fuegod xfg-swapd unified; do
            if [ -f "backends/$b" ]; then install -m 755 "backends/$b" "$APP/Contents/MacOS/$b"; fi
          done
          test -f "$APP/Contents/Frameworks/libfuego_ffi.dylib"
          ./scripts/bundle-macos-dylibs.sh "$APP"
        else
          for b in fuego_walletd fuegod xfg-swapd unified; do
            if [ -f "backends/$b" ]; then install -m 755 "backends/$b" "$APP/$b"; fi
          done
          install -m 644 backends/libfuego_ffi.so "$APP/lib/libfuego_ffi.so"
          # No-space launcher for the "Fuego Valise" executable; the .desktop Exec uses it.
          ln -sfn "Fuego Valise" "$APP/fuego-valise"
        fi
