name: Bundle desktop backends
description: >-
  Copies ./backends (from build-desktop-backends) into a built app where
  DaemonManager and FuegoNative look for them. Run after `flutter build`.

inputs:
  app:
    description: macOS .app bundle path, or Linux bundle directory
    required: true

runs:
  using: composite
  steps:
    - name: Bundle backends
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: |
        set -euo pipefail
        test -d "$APP"
        if [ "$RUNNER_OS" = "macOS" ]; then
          for b in fuego_walletd fuegod xfg-swapd unifyd; do
            install -m 755 "backends/$b" "$APP/Contents/MacOS/$b"
          done
          test -f "$APP/Contents/Frameworks/libfuego_ffi.dylib"
          ./scripts/bundle-macos-dylibs.sh "$APP"
        else
          for b in fuego_walletd fuegod xfg-swapd unifyd; do
            install -m 755 "backends/$b" "$APP/$b"
          done
          install -m 644 backends/libfuego_ffi.so "$APP/lib/libfuego_ffi.so"
          # The installed executable is named by the OUTPUT_NAME property
          # (APP_DISPLAY_NAME). BINARY_NAME is only the CMake target name, and reading
          # it here made `test -x` fail against a real bundle.
          bin=$(sed -n 's/^set(APP_DISPLAY_NAME "\(.*\)")$/\1/p' linux/CMakeLists.txt)
          test -n "$bin" && test -x "$APP/$bin"
          ln -sfn "$bin" "$APP/fuego-valise"
          test -x "$APP/fuego-valise"
        fi
