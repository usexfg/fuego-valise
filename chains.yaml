    ticker: ETH
    name: Ethereum
    family: evm
    chainId: 1
    rpc: https://eth.llamarpc.com
    gasToken: ETH
    color: "#627EEA"
    icon: assets/coin-icons/eth.png
    tier: swap
    confirmBlocks: 12

