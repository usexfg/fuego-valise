# chains.yaml — SINGLE SOURCE OF TRUTH for chain metadata.
#
# Regenerate the Dart registry after editing:
#   dart run tool/gen_chains.dart          # writes lib/models/chain_registry.g.dart
#   dart run tool/gen_chains.dart --check  # verify generated file is up to date
#
# Schema per entry:
#   key           lowercase canonical key (matches EvmChainKey)
#   ticker        uppercase display ticker
#   name          human display name
#   family        evm | utxo | cryptonote | sol
#   chainId       EVM chain id
#   rpc           default public JSON-RPC endpoint
#   gasToken      native gas ticker ('' when none, e.g. Tempo)
#   color         brand color "#RRGGBB"
#   icon          asset path (missing files are tolerated by the UI)
#   tier          swap  = wired into xfg-swapd orderbook
#                 wallet = ERC20 wallet layer only
#   confirmBlocks advisory confirmation depth before a tx is trusted
#
# Phase 1 scope: the 33 EvmChainKey chains ONLY.
# Non-EVM swap chains (btc/ltc/bch/kmd/dcr/sol/xmr) and ERC20 token
# constants stay hand-written elsewhere and are NOT listed here.

chains:
