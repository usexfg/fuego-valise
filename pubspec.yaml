name: fuego
description: "Fuego Valise & DEX — Privacy banking, CDs, and cross-chain trading"
publish_to: 'none'

version: 5.11.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Fuego Core ──

  # ── State Management ──
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7
  get_it: ^8.0.3

  # ── UI and Navigation ──
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296

  # ── HTTP and JSON ──
  http: ^1.4.0
  dio: ^5.4.0
  json_annotation: ^4.9.0

  # ── Crypto and Security ──
  crypto: ^3.0.6
  cryptography: ^2.5.0
  flutter_secure_storage: ^10.0.0-beta.4
  local_auth: ^2.3.0
  bip39: ^1.0.6
  ed25519_hd_key: ^2.2.0

  # ── QR Code ──
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0

  # ── File / Path ──
  file_picker: ^8.0.0+1
  path: ^1.9.1
  path_provider: ^2.1.5

  # ── FFI ──
  ffi: ^2.1.3

  # ── UI Components ──
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  fl_chart: ^0.66.2
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.16

  # ── System ──
  url_launcher: ^6.2.4
  device_info_plus: ^10.1.0
  connectivity_plus: ^5.0.2
  package_info_plus: ^8.1.3

  # ── Notifications / Logging ──
  flutter_local_notifications: ^17.0.0
  logging: ^1.3.0

  # ── Storage ──
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.2
  shared_preferences: ^2.3.2
  dns_client: ^1.3.1
  device_preview: ^1.3.1

  # ── Web3 / Cross-chain ──
  web3dart: ^2.7.3
  solana: ^0.32.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/bin/
    - assets/data/
    - assets/charts/
    - assets/coin icons/
    - assets/brand/

  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBM_Plex_Sans/static/IBMPlexSans-Light.ttf
          weight: 300
        - asset: assets/fonts/IBM_Plex_Sans/static/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM_Plex_Sans/static/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM_Plex_Sans/static/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM_Plex_Sans/static/IBMPlexSans-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans/NotoSans-Light.ttf
          weight: 300
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBM_Plex_Mono/static/IBMPlexMono-Light.ttf
          weight: 300
        - asset: assets/fonts/IBM_Plex_Mono/static/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM_Plex_Mono/static/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM_Plex_Mono/static/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBM_Plex_Mono/static/IBMPlexMono-Bold.ttf
          weight: 700
    - family: Trirong
      fonts:
        - asset: assets/fonts/Trirong/static/Trirong-Light.ttf
          weight: 300
        - asset: assets/fonts/Trirong/static/Trirong-Regular.ttf
          weight: 400
        - asset: assets/fonts/Trirong/static/Trirong-Medium.ttf
          weight: 500
        - asset: assets/fonts/Trirong/static/Trirong-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Trirong/static/Trirong-Bold.ttf
          weight: 700
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo/static/Arimo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Arimo/static/Arimo-Bold.ttf
          weight: 700
    - family: Bitter
      fonts:
        - asset: assets/fonts/Bitter/static/Bitter-Variable.ttf
    - family: Brygada1918
      fonts:
        - asset: assets/fonts/Brygada_1918/static/Brygada1918-Regular.ttf
          weight: 400
        - asset: assets/fonts/Brygada_1918/static/Brygada1918-Medium.ttf
          weight: 500
        - asset: assets/fonts/Brygada_1918/static/Brygada1918-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Brygada_1918/static/Brygada1918-Bold.ttf
          weight: 700
    - family: CormorantSC
      fonts:
        - asset: assets/fonts/Cormorant_SC/static/CormorantSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cormorant_SC/static/CormorantSC-SemiBold.ttf
          weight: 600
    - family: Cormorant
      fonts:
        - asset: assets/fonts/Cormorant/static/Cormorant-Variable.ttf
    - family: UnicaOne
      fonts:
        - asset: assets/fonts/Unica_One/static/UnicaOne-Regular.ttf
          weight: 400
    - family: Fahkwang
      fonts:
        - asset: assets/fonts/Fahkwang/static/Fahkwang-Regular.ttf
